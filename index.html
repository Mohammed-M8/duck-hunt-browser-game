<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duck Hunt</title>
    <link rel="icon" href="./assets/Icon.png">
    <link rel="stylesheet" href="./css/style.css">
    <script defer src="./js/app.js"></script>
</head>

<body>
    <div class="overlay">
        <h1>(not) DUCK HUNT</h1>
        <h2 id="result"></h2>
        <button class="play">Play?</button>
    </div>
    <div class="info hidden">
        <h1>How to Play</h1>
        <h2>Shoot!!!!!!</h2>
        <div>
            <img alt="Duck" class="image" src="./assets/duckEnemy-1.png">
            Duck
        </div>
        <h2>Do Not Shoot Plz</h2>
        <div>
            <img alt="Crow" class="image" src="./assets/crowChill-1.png">
            <span>Not Duck</span>
            <img alt="Eagle" class="image" src="./assets/eagleChill-1.png">
            <span>Also Not Duck</span>
        </div>
        <button class="start">Start</button>
    </div>
    <div class="UI hidden">
        <div class="stats">
            <div class="bullets">LIVES <span id="remain"></span></div>
            <div class="timer">TIMER <span id="time"></span></div>
            <div class="target">TARGET <span id="score"></span></div>
        </div>
        <div class="game">

        </div>
        >
